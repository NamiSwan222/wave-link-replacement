[package]
name = "wavefix-fx"
version = "1.0.0"
edition = "2024"
description = "WaveFix voice effects: a VST2 plugin Equalizer APO runs inside the Windows audio engine"
license = "MIT"
publish = false

[lib]
name = "wavefix_fx"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Never abort: this runs inside audiodg.exe, and an abort would stop all Windows audio.
panic = "unwind"
